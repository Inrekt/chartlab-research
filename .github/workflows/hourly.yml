name: Hourly incubator tick

# Догонка инкубатора и надзора на свежих закрытых барах Binance.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

concurrency:
  group: research-data
  cancel-in-progress: false

# Тик обновляет обезличенный статус в СВОЁМ (публичном) репозитории.
permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: Inrekt/chartlab-research-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # См. nightly.yml: журнал живёт в репозитории текстовым дампом.
      - name: Restore journal from dump
        env:
          RESEARCHER_DATA_DIR: ${{ github.workspace }}/data/ledger
        run: npx tsx researcher/journal-sync.ts restore

      # Тот же кэш корпуса, что и у ночи: инкубатор обязан считать по ТОМУ ЖЕ
      # рынку, что и скрин. Иначе кандидат проверялся бы на фьючерсах, а
      # догонялся спотом — и форвард измерял бы не то, что отбор.
      - name: Cache candle corpus
        uses: actions/cache@v4
        with:
          path: corpus
          key: corpus-perp-${{ github.run_id }}
          restore-keys: |
            corpus-perp-

      - name: Top up corpus from exchange
        continue-on-error: true
        env:
          RESEARCHER_HISTORY_DIR: ${{ github.workspace }}/corpus
        run: npx tsx researcher/collect-candles.ts --source perp --tf 1h,4h --out corpus

      - name: Catch up incubation + supervision
        env:
          RESEARCHER_HISTORY_DIR: ${{ github.workspace }}/corpus
          RESEARCHER_DATA_DIR: ${{ github.workspace }}/data/ledger
          RESEARCHER_VAULT_DIR: ${{ github.workspace }}/data/vault
          RESEARCHER_STATUS_DIR: ${{ github.workspace }}/status
          # См. комментарий в nightly.yml: инкубатор гоняет тот же движок,
          # и без COLLECT_DIR фандинговый кандидат просидел бы 365 дней с
          # нулём форвард-сделок и умер бы «по календарю».
          COLLECT_DIR: ${{ github.workspace }}/data/market
        run: npx tsx researcher/hourly.ts

      # Та же причина, что в nightly.yml: форвард-сделки инкубатора уже
      # записаны, и терять их из-за падения следующего шага нельзя — курсор
      # уедет, а сделки исчезнут.
      - name: Dump journal for git
        if: always()
        env:
          RESEARCHER_DATA_DIR: ${{ github.workspace }}/data/ledger
        run: npx tsx researcher/journal-sync.ts dump

      - name: Commit journal to the private repo
        if: always()
        run: |
          cd data
          git config user.name "chartlab-research-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "tick $(date -u '+%F %H:%M') UTC"
          git push

      # См. nightly.yml: статус обязан публиковаться и при падении, иначе
      # экран показывает старые хорошие цифры мёртвой машины.
      - name: Publish anonymised status (monitor in the app reads this)
        if: always()
        run: |
          git config user.name "chartlab-research-bot"
          git config user.email "bot@users.noreply.github.com"
          git add status/status.json
          git diff --cached --quiet && exit 0
          git commit -m "status: tick $(date -u '+%F %H:%M') UTC"
          # Публичный репозиторий получает и коммиты с кодом, поэтому push
          # без ребейза однажды упал бы non-fast-forward и уронил тик.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          echo "не удалось опубликовать статус после трёх попыток" >&2
          exit 1
