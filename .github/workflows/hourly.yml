name: Hourly incubator tick

# Догонка инкубатора и надзора на свежих закрытых барах Binance.
on:
  # ⛔ РАСПИСАНИЕ ОТКЛЮЧЕНО 2026-08-19: боевой контур переехал на мак
  # (~/.chartlab/bin/{nightly,hourly}.sh + launchd). Журнал обязан писать
  # ОДИН процесс: два независимых поиска тратили бы одни и те же комбинации
  # дважды, и учёт множественности поехал бы. Ручной запуск оставлен —
  # это же и путь обратно в облако, если мак недоступен.
  # schedule:
  #   - cron: "7 * * * *"
  workflow_dispatch: {}

concurrency:
  group: research-data
  cancel-in-progress: false

# Тик обновляет обезличенный статус в СВОЁМ (публичном) репозитории.
permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: Inrekt/chartlab-research-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # См. nightly.yml: журнал живёт в репозитории текстовым дампом.
      - name: Restore journal from dump
        env:
          RESEARCHER_DATA_DIR: ${{ github.workspace }}/data/ledger
        run: npx tsx researcher/journal-sync.ts restore

      # Кэш корпуса восстанавливается, но НЕ дозаписывается: тик корпус не
      # читает вовсе — и инкубатор, и надзор тянут живые бары с биржи. Нужен
      # только МАНИФЕСТ, чтобы знать рынок: без него живые бары берутся со
      # спота по умолчанию, и кандидат, отобранный на перпах, догонялся бы на
      # другом рынке. Полная закачка корпуса здесь не влезла бы в timeout 20
      # минут и всё равно ничего бы не дала — её делает ночь.
      - name: Restore candle corpus (manifest only is what the tick needs)
        uses: actions/cache/restore@v4
        with:
          path: corpus
          key: corpus-perp-v2-${{ github.run_id }}
          restore-keys: |
            corpus-perp-v2-

      - name: Catch up incubation + supervision
        env:
          RESEARCHER_HISTORY_DIR: ${{ github.workspace }}/corpus
          RESEARCHER_DATA_DIR: ${{ github.workspace }}/data/ledger
          RESEARCHER_VAULT_DIR: ${{ github.workspace }}/data/vault
          RESEARCHER_STATUS_DIR: ${{ github.workspace }}/status
          # См. комментарий в nightly.yml: инкубатор гоняет тот же движок,
          # и без COLLECT_DIR фандинговый кандидат просидел бы 365 дней с
          # нулём форвард-сделок и умер бы «по календарю».
          COLLECT_DIR: ${{ github.workspace }}/data/market
        run: npx tsx researcher/hourly.ts

      # Та же причина, что в nightly.yml: форвард-сделки инкубатора уже
      # записаны, и терять их из-за падения следующего шага нельзя — курсор
      # уедет, а сделки исчезнут.
      - name: Dump journal for git
        if: always()
        env:
          RESEARCHER_DATA_DIR: ${{ github.workspace }}/data/ledger
        run: npx tsx researcher/journal-sync.ts dump

      - name: Commit journal to the private repo
        if: always()
        run: |
          cd data
          git config user.name "chartlab-research-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "tick $(date -u '+%F %H:%M') UTC"
          git push

      # См. nightly.yml: статус обязан публиковаться и при падении, иначе
      # экран показывает старые хорошие цифры мёртвой машины.
      - name: Publish anonymised status (monitor in the app reads this)
        if: always()
        run: |
          git config user.name "chartlab-research-bot"
          git config user.email "bot@users.noreply.github.com"

          # Статус — СГЕНЕРИРОВАННЫЙ снимок, а не правка текста: сливать его
          # не с чем, прав последний писатель. Поэтому здесь не ребейз, а
          # перестроение поверх свежего origin/main на каждой попытке.
          #
          # Ребейз тут уже подводил: при конфликте status.json он вставал с
          # незакрытыми файлами, а цикл повторов пытался тянуть снова и падал
          # с «Pulling is not possible because you have unmerged files» —
          # прерванный ребейз никто не отменял, и все три попытки были
          # обречены. Такой конфликт возникает всякий раз, когда ночь и тик
          # заканчиваются рядом.
          # Статуса может не быть вовсе: прогон мог упасть ДО его записи.
          # Это не повод ронять ещё и публикацию — жаловаться будет сторож
          # молчания, а не эта строка.
          if [ ! -f status/status.json ]; then
            echo "статус не сформирован — публиковать нечего" >&2
            exit 0
          fi
          cp status/status.json "$RUNNER_TEMP/status.json"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/status.json" status/status.json
            git add status/status.json
            git diff --cached --quiet && exit 0
            git commit -q -m "status: tick $(date -u '+%F %H:%M') UTC"
            git push -q && exit 0
            sleep 5
          done
          echo "не удалось опубликовать статус после трёх попыток" >&2
          exit 1
