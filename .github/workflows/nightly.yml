name: Nightly research

# 21:37 UTC = 02:37 Алматы — та же ночь, что была у launchd-демона.
on:
  schedule:
    - cron: "37 21 * * *"
  workflow_dispatch: {}

# Одна группа с hourly: журнал испытаний пишет только один процесс за раз.
concurrency:
  group: research-data
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private data repo (journal is the product)
        uses: actions/checkout@v4
        with:
          repository: Inrekt/chartlab-research-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run the night (both universes)
        env:
          RESEARCHER_DATA_DIR: ${{ github.workspace }}/data/ledger
          RESEARCHER_VAULT_DIR: ${{ github.workspace }}/data/vault
          RESEARCHER_NIGHT_N: "2000"
        run: npx tsx researcher/nightly.ts > night-summary.json

      - name: Commit journal + digest to the private repo
        run: |
          cd data
          git config user.name "chartlab-research-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "night $(date -u '+%F %H:%M') UTC"
          git push
