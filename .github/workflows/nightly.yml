name: Nightly research

# 21:37 UTC = 02:37 Алматы — та же ночь, что была у launchd-демона.
on:
  schedule:
    - cron: "37 21 * * *"
  workflow_dispatch: {}

# Одна группа с hourly: журнал испытаний пишет только один процесс за раз.
concurrency:
  group: research-data
  cancel-in-progress: false

# Ночь коммитит обезличенный статус в СВОЙ (публичный) репозиторий — журнал
# по-прежнему уходит в приватный по deploy-ключу.
permissions:
  contents: write

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private data repo (journal is the product)
        uses: actions/checkout@v4
        with:
          repository: Inrekt/chartlab-research-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Журнал хранится в репозитории ТЕКСТОВЫМ ДАМПОМ, а не бинарником:
      # trials.sqlite дорос до 97 МиБ при жёстком лимите GitHub 100 МиБ, а
      # дамп тех же данных весит 10.5 МиБ (замерено). Здесь он разворачивается
      # обратно в базу перед прогоном.
      - name: Restore journal from dump
        env:
          RESEARCHER_DATA_DIR: ${{ github.workspace }}/data/ledger
        run: npx tsx researcher/journal-sync.ts restore

      # Корпус свечей — ВОСПРОИЗВОДИМЫЙ артефакт, а не хранимый актив: он
      # скачивается с биржи и дозаписывается хвостом. Поэтому он лежит в кэше
      # раннера, а не в git: хранение переписывало бы все 324 сжатых файла при
      # каждом обновлении и растило репозиторий на ~100 МБ за раз, ничего не
      # выигрывая. Ключ с датой — раз в сутки кэш обновляется, restore-keys
      # подхватывает вчерашний, и сборщику остаётся дописать только хвост.
      - name: Restore candle corpus
        uses: actions/cache/restore@v4
        with:
          path: corpus
          key: corpus-perp-${{ github.run_id }}
          restore-keys: |
            corpus-perp-

      # Источник — АРХИВ, а не REST, и это вынужденно: раннеры GitHub получают
      # от api/fapi.binance.com `451 Unavailable For Legal Reasons` (замерено
      # probe.yml). Архив data.binance.vision отвечает 200 и отдаёт те же
      # фьючерсные свечи, отставая примерно на сутки. Для ночного скрина на
      # пятилетней истории сутки несущественны.
      #
      # Прогон НЕ ПАДАЕТ, если архив недоступен: свежесть корпуса проверяет
      # предполёт, он и решит, можно ли считать.
      - name: Top up corpus from archive
        continue-on-error: true
        env:
          RESEARCHER_HISTORY_DIR: ${{ github.workspace }}/corpus
        run: npx tsx researcher/collect-candles.ts --source mirror --tf 1h,4h --out corpus

      # Сохранение ОТДЕЛЬНЫМ шагом с if: always() — иначе тупик, в который мы
      # уже попали. `actions/cache` пишет кэш пост-шагом и ТОЛЬКО при успехе
      # джоба; ночь падает на исчерпанном пространстве гипотез → кэш не
      # сохраняется → следующая ночь снова качает всё заново, а часовой тик,
      # видя пустой каталог, берёт живые бары со СПОТА, пока скрин считает по
      # перпам. Ровно то расхождение, ради которого корпус и переезжал.
      - name: Save candle corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: corpus
          key: corpus-perp-${{ github.run_id }}

      - name: Run the night (both universes)
        env:
          RESEARCHER_DATA_DIR: ${{ github.workspace }}/data/ledger
          RESEARCHER_VAULT_DIR: ${{ github.workspace }}/data/vault
          RESEARCHER_STATUS_DIR: ${{ github.workspace }}/status
          # Фандинг и почасовые метрики лежат в приватном data-репо, который
          # смонтирован в data/. Без этой переменной readFundingCsv молча
          # возвращает null на каждый символ, атом funding даёт false на
          # каждом баре, и семейство умирает как «мало сделок» — так было
          # убито 212 испытаний funding_pressure (все с нулём сделок).
          COLLECT_DIR: ${{ github.workspace }}/data/market
          # ⚠️ ГРАНИЦА ЭПОХИ. Корпус из кэша — ФЬЮЧЕРСНЫЙ (162 перпа с
          # 2019-09), тогда как прежний в public/data/history был СПОТОВЫМ.
          # Это разные рынки: цена похожа, но фандинг, открытый интерес и
          # ликвидации существуют только у вторых — а вся наша микроструктура
          # построена на них. Испытания до и после этой строки НЕ СРАВНИМЫ, и
          # различаются они по полю corpus_version в журнале.
          RESEARCHER_HISTORY_DIR: ${{ github.workspace }}/corpus
          RESEARCHER_NIGHT_N: "2000"
        run: npx tsx researcher/nightly.ts > night-summary.json

      # Журнал коммитится ДАЖЕ если ночь упала. Испытания уже прогнаны и
      # записаны в SQLite: без этого падение любого шага ПОСЛЕ скрина
      # (инкубатор, надзор, дайджест) выбрасывало все ~4000 испытаний ночи,
      # nEffective не рос, дедуп не срабатывал — и следующая ночь честно
      # прогоняла ровно те же спеки заново.
      # Дамп СНАЧАЛА, коммит потом — и то и другое при падении ночи: испытания
      # уже в базе, терять их из-за упавшего шага нельзя. Здесь же срабатывает
      # страж размера: превышение порога — ошибка инфраструктуры с внятным
      # текстом, а не тихая потеря push'а.
      - name: Dump journal for git
        if: always()
        env:
          RESEARCHER_DATA_DIR: ${{ github.workspace }}/data/ledger
        run: npx tsx researcher/journal-sync.ts dump

      - name: Commit journal + digest to the private repo
        if: always()
        run: |
          cd data
          git config user.name "chartlab-research-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "night $(date -u '+%F %H:%M') UTC"
          git push

      # Публикуется ДАЖЕ если ночь упала — и это важнее, чем кажется. Без
      # if: always() красная ночь оставляла на экране ПРЕДЫДУЩИЙ зелёный
      # статус: снаружи всё хорошо, внутри машина мертва. Ровно так корпус
      # простоял две недели, а ночи 06.08 не было вовсе и никто не заметил.
      # Статус обязан говорить правду в первую очередь ИМЕННО о провале.
      - name: Publish anonymised status (monitor in the app reads this)
        if: always()
        run: |
          git config user.name "chartlab-research-bot"
          git config user.email "bot@users.noreply.github.com"
          git add status/status.json
          git diff --cached --quiet && exit 0
          git commit -m "status: night $(date -u '+%F %H:%M') UTC"
          # Ночь длится ~2 часа: за это время в публичный репозиторий вполне
          # мог прилететь коммит с кодом, и обычный push упал бы non-fast-forward,
          # уронив всю ночь на последнем шаге. Ребейз держит статус поверх.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          echo "не удалось опубликовать статус после трёх попыток" >&2
          exit 1
