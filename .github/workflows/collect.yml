# Ежесуточный сборщик невосстановимых данных (OI/лонг-шорт Binance через
# bulk-зеркало, срез опционной поверхности Deribit, DVOL, Fear&Greed, макро
# FRED, снапшот вселенной). Что не собрано сегодня — потеряно навсегда,
# поэтому у workflow отдельный крон, но ОБЩАЯ concurrency-группа с ночью:
# журнал-репозиторий пушится из одного процесса за раз.
name: Daily data collectors
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: research-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Inrekt/chartlab-research-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect
        env:
          COLLECT_DIR: ${{ github.workspace }}/data/market
        run: npx tsx researcher/collect.ts | tee collect-summary.json

      # Лента анонсов и состав биржи — тоже невосстановимый форвардный срез,
      # но collect-events не запускался НИ РАЗУ: расписания у него не было.
      # continue-on-error, потому что bapi Binance регулярно отвечает WAF, и
      # это не повод терять уже собранное выше.
      - name: Collect announcements + exchange snapshot
        continue-on-error: true
        env:
          COLLECT_DIR: ${{ github.workspace }}/data/market
        run: |
          npx tsx researcher/collect-events.ts announcements
          npx tsx researcher/collect-events.ts exchange-snapshot

      # Времена жизни символов — по одному запросу к S3 НА КАЖДЫЙ символ
      # (500+), поэтому раз в неделю, а не ежедневно: факт меняется медленно,
      # а ежедневный прогон жёг бы минуты Actions без новой информации.
      - name: Collect symbol lifespans (weekly)
        continue-on-error: true
        env:
          COLLECT_DIR: ${{ github.workspace }}/data/market
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$(date -u +%u)" != "7" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "не воскресенье — пропускаем"
            exit 0
          fi
          npx tsx researcher/collect-events.ts lifespans

      # if: always() по той же причине, что у журнала: собранное сегодня
      # невосстановимо. Без него падение ЛЮБОГО шага выше выбрасывало день
      # фандинга, открытого интереса и снимков вселенной — данные, которые
      # задним числом не купить ни за какие деньги.
      - name: Commit data
        if: always()
        working-directory: data
        run: |
          git config user.name "chartlab-collector"
          git config user.email "collector@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "нет новых данных"; exit 0; }
          git commit -m "market: daily collect $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            sleep 5
          done
